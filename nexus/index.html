<script>
(()=>{'use strict';
  const KEY='nexus-desk-v1', VERSION=1;

  const I=(name,cls='')=>`<svg class="${cls}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
  const keyDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const today=()=>keyDate(new Date());
  const dateOffset=(offset,origin=new Date())=>{const d=new Date(origin.getFullYear(),origin.getMonth(),origin.getDate()+offset);return keyDate(d)};
  const dateParse=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10))):new Date();
  const dateLabel=(s,opt={day:'numeric',month:'short'})=>dateParse(s).toLocaleDateString('de-DE',opt);

    {id:uid(),title:'Meine erste Aufgabe abhaken',desc:'Einfach links auf das Kästchen klicken',due:today(),priority:'high',done:false,completedAt:null,createdAt:new Date().toISOString()},
    {id:uid(),title:'Meine Woche planen',desc:'Öffne den Kalender und füge etwas hinzu',due:dateOffset(1),priority:'medium',done:false,completedAt:null,createdAt:new Date().toISOString()},
    {id:uid(),title:'Eine neue Idee festhalten',desc:'Schreibe etwas in deine Notizen',due:'',priority:'low',done:false,completedAt:null,createdAt:new Date().toISOString()}
  ],notes:[{id:uid(),title:'Willkommen in NEXUS ✦',body:'Das ist dein persönlicher Space.\n\n• Aufgaben planen und abhaken\n• Termine im Kalender sehen\n• Ideen als Notizen speichern\n• Routinen für jeden Tag tracken\n• Mit dem Fokus-Timer konzentriert bleiben\n\nAlle Einträge werden automatisch in diesem Browser gespeichert. Unter Einstellungen kannst du eine Sicherung herunterladen.',color:'aqua',updatedAt:new Date().toISOString()}],habits:[

  ],focus:{mode:'focus',durationSec:1500,remainingSec:1500,running:false,endAt:0,sessions:[]}});
  function normalize(raw){const base=starter();if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Ungültiges Dateiformat');
    const s=raw.settings||{};base.settings={name:String(s.name||'').slice(0,40),theme:['dark','light'].includes(s.theme)?s.theme:'dark',accent:['indigo','aqua','pink','orange'].includes(s.accent)?s.accent:'indigo',introDismissed:!!s.introDismissed};
    base.tasks=Array.isArray(raw.tasks)?raw.tasks.slice(0,3000).map(t=>({id:String(t.id||uid()),title:String(t.title||'Unbenannte Aufgabe').slice(0,150),desc:String(t.desc||'').slice(0,3000),due:/^\d{4}-\d{2}-\d{2}$/.test(t.due)?t.due:'',priority:priorities[t.priority]?t.priority:'medium',done:!!t.done,completedAt:typeof t.completedAt==='string'?t.completedAt:null,createdAt:typeof t.createdAt==='string'?t.createdAt:new Date().toISOString()})):[];
    base.notes=Array.isArray(raw.notes)?raw.notes.slice(0,2000).map(n=>({id:String(n.id||uid()),title:String(n.title||'Notiz').slice(0,150),body:String(n.body||'').slice(0,50000),color:['violet','aqua','orange','pink','green'].includes(n.color)?n.color:'violet',updatedAt:typeof n.updatedAt==='string'?n.updatedAt:new Date().toISOString()})):[];
    base.habits=Array.isArray(raw.habits)?raw.habits.slice(0,200).map(h=>({id:String(h.id||uid()),name:String(h.name||'Routine').slice(0,100),emoji:String(h.emoji||'⭐').slice(0,4),history:Object.fromEntries(Object.entries(h.history&&typeof h.history==='object'&&!Array.isArray(h.history)?h.history:{}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v===true).slice(-3650))})):[];
    const f=raw.focus||{},duration=Math.max(60,Math.min(10800,Number(f.durationSec)||1500));base.focus={mode:['focus','short','long','custom'].includes(f.mode)?f.mode:'focus',durationSec:duration,remainingSec:Number.isFinite(Number(f.remainingSec))?Math.max(0,Math.min(duration,Number(f.remainingSec))):duration,running:!!f.running,endAt:Number(f.endAt)||0,sessions:Array.isArray(f.sessions)?f.sessions.slice(-2000).filter(x=>x&&typeof x==='object').map(x=>({date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:today(),minutes:Math.max(0,Math.min(180,Number(x.minutes)||0)),mode:String(x.mode||'focus')})):[]};
    return base;
  }
  let data;try{let raw=localStorage.getItem(KEY);data=raw?normalize(JSON.parse(raw)):starter()}catch(e){console.warn('Daten konnten nicht geladen werden',e);data=starter()}

  function shell(){return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${I('logo')}</span><div><div class="brand-name">NEXUS</div><div class="brand-tag">DEIN SPACE</div></div></div><p class="nav-label">MENÜ</p><nav class="nav" aria-label="Hauptnavigation">${navItems.map(([page,ico,label])=>`<button class="nav-btn ${ui.page===page?'active':''}" data-action="navigate" data-page="${page}" title="${label}" ${ui.page===page?'aria-current="page"':''}>${I(ico)}<span>${label}</span>${page==='tasks'&&taskOpen().length?`<span class="nav-badge">${taskOpen().length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-footer"><div class="sidebar-tip"><strong>✦ Dein Space, deine Regeln.</strong><p>Ohne Account. Ohne Abo. Einfach organisieren.</p></div><button class="nav-btn ${ui.page==='settings'?'active':''}" data-action="navigate" data-page="settings">${I('settings')}<span>Einstellungen</span></button><div class="footer-version">NEXUS v1.0 · Lokal gespeichert</div></div></aside><div class="content"><div class="topbar"><div class="top-context"><span class="live-dot"></span><span>DEIN PERSÖNLICHER HUB</span></div><div class="top-actions"><span class="top-date">${niceDate(new Date())}</span><button class="icon-btn" data-action="search" aria-label="Aufgaben suchen" title="Aufgaben suchen">${I('search')}</button><button class="icon-btn" data-action="navigate" data-page="settings" aria-label="Einstellungen" title="Einstellungen">${I('settings')}</button><span class="user-avatar">${esc((data.settings.name||'DU').trim().slice(0,2).toUpperCase())}</span></div></div><main class="main" id="page-content">${pageContent()}</main></div></div>`}

  function metric(title,value,subtitle,ico){return `<section class="card metric"><span class="metric-label">${title}</span><div class="metric-icon">${I(ico)}</div><div class="metric-value">${value}</div><div class="metric-bottom">${subtitle}</div></section>`}
  function dashboard(){const open=taskOpen().sort(sortTask),daily=taskToday(),doneDaily=daily.filter(t=>t.done).length,pct=daily.length?Math.round(doneDaily/daily.length*100):100;return `${pageHeader('DEIN COCKPIT',`${greeting()}${data.settings.name?', '+esc(data.settings.name):''}.`,'Alles Wichtige für deinen Tag. An einem Ort.',`<button class="btn btn-primary" data-action="new-task">${I('plus')} Aufgabe erstellen</button>`)}${welcome()}<div class="metrics">${metric('Offene Aufgaben',open.length,'Noch zu erledigen','tasks')}${metric('Heute geschafft',completedToday(),'Erledigte Aufgaben heute','check')}${metric('Routinen heute',`${habitsDone()}/${data.habits.length}`,'Deine täglichen Gewohnheiten','habits')}${metric('Fokus heute',`${focusMinutesToday()}m`,'Abgeschlossene Fokuszeit','focus')}</div><div class="dashboard-grid"><section class="card hero-card"><div class="hero-content"><span class="hero-badge">✦ DEIN TAGESPLAN</span><h2 class="hero-title">${daily.length&&pct===100?'Alle Aufgaben für heute geschafft!':daily.length?`${daily.length-doneDaily} ${daily.length-doneDaily===1?'Aufgabe':'Aufgaben'} für heute offen.`:'Dein Tag wartet auf dich.'}</h2><div class="hero-desc">${daily.length?`${doneDaily} von ${daily.length} heutigen Aufgaben erledigt. Bleib dran – jeder kleine Schritt zählt.`:'Plane, was dir wichtig ist, und bring Struktur in deinen Tag.'}</div><div class="hero-actions"><button class="btn btn-primary btn-small" data-action="new-task" data-date="${today()}">${I('plus')} Für heute planen</button><button class="btn btn-ghost btn-small" data-action="navigate" data-page="calendar">Kalender ${I('arrow')}</button></div></div><div class="hero-ring" style="--progress:${pct}%"><div class="hero-ring-content"><strong>${pct}%</strong><span>heute</span></div></div></section><section class="card mini-focus"><div><div class="focus-label">${I('focus')} DEEP FOCUS</div><div id="mini-timer" class="mini-timer">${formatClock(remain())}</div><p>Alles andere kann gerade warten.</p></div><div class="mini-focus-footer"><button class="btn btn-primary" data-action="focus-toggle">${I(data.focus.running?'pause':'play')} <span id="mini-focus-text">${data.focus.running?'Pause':'Fokus starten'}</span></button><button class="tiny-icon-btn" data-action="navigate" data-page="focus" aria-label="Timer öffnen" title="Timer öffnen">${I('arrow')}</button></div></section></div><div class="dashboard-bottom"><section class="card pane"><div class="card-head"><div><h2 class="section-title">Deine nächsten Aufgaben</h2><p class="section-sub">Damit du nichts vergisst</p></div><button class="text-btn" data-action="navigate" data-page="tasks">Alle ansehen →</button></div>${open.length?open.slice(0,5).map(t=>taskRow(t,false)).join(''):emptySmall('Noch keine offenen Aufgaben.','new-task','Aufgabe erstellen')}</section><section class="card pane"><div class="card-head"><div><h2 class="section-title">Deine Routinen</h2><p class="section-sub">Kleine Gewohnheiten, große Wirkung</p></div><button class="text-btn" data-action="navigate" data-page="habits">Alle ansehen →</button></div><div class="habit-preview">${data.habits.length?data.habits.slice(0,4).map(h=>`<div class="habit-preview-row"><span class="emoji-tile">${esc(h.emoji)}</span><div class="habit-preview-name">${esc(h.name)}<small>${habitStreak(h)} Tage Serie</small></div><button class="habit-toggle ${h.history[today()]?'on':''}" data-action="toggle-habit" data-id="${esc(h.id)}" aria-label="${esc(h.name)} ${h.history[today()]?'als offen markieren':'als erledigt markieren'}">${I('check')}</button></div>`).join(''):emptySmall('Noch keine Routinen.','new-habit','Routine erstellen')}</div>${data.habits.length?`<div class="insight"><strong>${habitsDone()} von ${data.habits.length}</strong> Routinen hast du heute erledigt.</div>`:''}</section></div>`}
  function emptySmall(msg,action,label){return `<div class="cal-empty">${esc(msg)}<div style="margin-top:12px"><button class="btn btn-ghost btn-small" data-action="${action}">${I('plus')} ${label}</button></div></div>`}
  function sortTask(a,b){if(a.done!==b.done)return Number(a.done)-Number(b.done);if(!a.due)return 1;if(!b.due)return -1;return a.due.localeCompare(b.due)||({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority])}
  function taskRow(t,full=true){let due=t.due?`<span class="pill ${!t.done&&t.due<today()?'overdue':t.due===today()?'today':''}">${!t.done&&t.due<today()?'Überfällig · ':''}${esc(humanDate(t.due))}</span>`:'';return `<div class="task-row"><button class="task-check ${t.done?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}" title="${t.done?'Als offen markieren':'Als erledigt markieren'}" aria-label="${t.done?'Als offen markieren':'Als erledigt markieren'}: ${esc(t.title)}">${t.done?I('check'):''}</button><div class="task-info"><div class="task-title ${t.done?'done':''}">${esc(t.title)}</div>${full&&t.desc?`<div class="task-desc">${esc(t.desc)}</div>`:''}<div class="task-meta"><span><i class="priority-dot ${t.priority}"></i> ${priorities[t.priority]}</span>${due}</div></div><div class="row-actions"><button class="row-icon" data-action="edit-task" data-id="${esc(t.id)}" title="Bearbeiten" aria-label="Aufgabe bearbeiten">${I('edit')}</button>${full?`<button class="row-icon" data-action="delete-task" data-id="${esc(t.id)}" title="Löschen" aria-label="Aufgabe löschen">${I('trash')}</button>`:''}</div></div>`}
  function filteredTasks(){let ts=data.tasks.filter(t=>ui.taskFilter==='all'||(ui.taskFilter==='open'?!t.done:ui.taskFilter==='done'?t.done:ui.taskFilter==='today'?t.due===today():t.priority==='high'&&!t.done));let s=ui.taskSearch.toLocaleLowerCase('de-DE').trim();if(s)ts=ts.filter(t=>(t.title+' '+t.desc).toLocaleLowerCase('de-DE').includes(s));return ts.sort(sortTask)}
  function taskListContent(){const ts=filteredTasks();return ts.length?`<div class="card task-list-card">${ts.map(t=>taskRow(t)).join('')}</div>`:`<div class="card task-empty"><div class="empty-icon">${I('check')}</div><h3>Hier ist gerade alles leer.</h3><p>${ui.taskSearch?'Versuch einen anderen Suchbegriff.':'Du kannst neue Aufgaben anlegen oder einen anderen Filter wählen.'}</p><button class="btn btn-primary btn-small" data-action="new-task">${I('plus')} Neue Aufgabe</button></div>`}
  function tasks(){return `${pageHeader('DEINE TO-DOS','Alles im Griff.','Plane deine Aufgaben, setze Prioritäten und hake Erledigtes ab.',`<button class="btn btn-primary" data-action="new-task">${I('plus')} Neue Aufgabe</button>`)}<div class="toolbar"><label class="search-field">${I('search')}<input id="task-search" placeholder="Aufgaben durchsuchen ..." value="${esc(ui.taskSearch)}" aria-label="Aufgaben durchsuchen"></label><div class="segments">${[['all','Alle'],['open','Offen'],['today','Heute'],['high','Wichtig'],['done','Erledigt']].map(([id,label])=>`<button class="segment ${ui.taskFilter===id?'active':''}" data-action="filter-tasks" data-filter="${id}">${label}</button>`).join('')}</div></div><div id="task-results">${taskListContent()}</div>`}
  function calendar(){let m=ui.calendarMonth,y=m.getFullYear(),mo=m.getMonth(),start=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate();let count=Math.ceil((start+days)/7)*7,nums=[];for(let n=0;n<count;n++){let d=new Date(y,mo,n-start+1),k=keyDate(d),matches=data.tasks.filter(t=>t.due===k);nums.push(`<button class="day ${d.getMonth()!==mo?'outside':''} ${k===today()?'today':''} ${k===ui.selectedDate?'selected':''}" data-action="select-date" data-date="${k}" aria-label="${dateLabel(k,{weekday:'long',day:'numeric',month:'long'})}, ${matches.length} Aufgaben"><span class="day-number">${d.getDate()}</span><span class="day-dots">${matches.slice(0,5).map(t=>`<i class="${t.done?'done':''}"></i>`).join('')}</span></button>`)}const selected=data.tasks.filter(t=>t.due===ui.selectedDate).sort(sortTask);return `${pageHeader('DEINE ZEIT','Kalender','Ein Überblick über deine geplanten Aufgaben.',`<button class="btn btn-primary" data-action="new-task" data-date="${ui.selectedDate}">${I('plus')} Termin / Aufgabe</button>`)}<div class="calendar-layout"><section class="card calendar-card"><div class="calendar-nav"><strong>${m.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</strong><div class="calendar-controls"><button class="btn btn-ghost btn-small" data-action="calendar-today">Heute</button><button class="icon-btn" data-action="prev-month" aria-label="Vorheriger Monat">${I('left')}</button><button class="icon-btn" data-action="next-month" aria-label="Nächster Monat">${I('right')}</button></div></div><div class="cal-weekdays">${weekDays.map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${nums.join('')}</div><p class="section-sub" style="margin-top:15px">Punkte markieren Tage mit Aufgaben. Grün bedeutet erledigt.</p></section><aside class="card calendar-side"><span class="eyebrow">AUSGEWÄHLTER TAG</span><div class="calendar-side-date" style="margin-top:12px">${dateLabel(ui.selectedDate,{weekday:'long',day:'numeric'})}</div><div class="calendar-side-month">${dateLabel(ui.selectedDate,{month:'long',year:'numeric'})}</div><div class="card-head"><strong style="font-size:12px">${selected.length} ${selected.length===1?'Aufgabe':'Aufgaben'}</strong><button class="text-btn" data-action="new-task" data-date="${ui.selectedDate}">+ Hinzufügen</button></div><div class="cal-task-list">${selected.length?selected.map(t=>taskRow(t,false)).join(''):`<div class="cal-empty">Für diesen Tag ist noch nichts geplant.<div style="margin-top:13px"><button class="btn btn-ghost btn-small" data-action="new-task" data-date="${ui.selectedDate}">${I('plus')} Jetzt planen</button></div></div>`}</div></aside></div>`}
  const noteCard=n=>`<article class="card note-card" data-action="edit-note" data-id="${esc(n.id)}" role="button" tabindex="0" aria-label="Notiz ${esc(n.title)} öffnen"><div class="note-color ${esc(n.color)}"></div><div class="note-name">${esc(n.title)}</div><div class="note-excerpt">${esc(n.body||'Noch kein Text ...')}</div><div class="note-footer"><span>Bearbeitet ${dateLabel(keyDate(new Date(n.updatedAt)))}</span><button class="row-icon" data-action="delete-note" data-id="${esc(n.id)}" title="Notiz löschen" aria-label="Notiz löschen">${I('trash')}</button></div></article>`;
  function notesContent(){let s=ui.noteSearch.toLocaleLowerCase('de-DE').trim(),list=data.notes.filter(n=>(n.title+' '+n.body).toLocaleLowerCase('de-DE').includes(s)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return list.length?`<div class="notes-grid">${list.map(noteCard).join('')}</div>`:`<div class="card task-empty"><div class="empty-icon">${I('notes')}</div><h3>Keine Notizen gefunden</h3><p>Halte Ideen, Gedanken und wichtige Infos fest.</p><button class="btn btn-primary" data-action="new-note">${I('plus')} Notiz erstellen</button></div>`}
  function notes(){return `${pageHeader('DEINE IDEEN','Notizen','Für Gedanken, die du nicht verlieren möchtest.',`<button class="btn btn-primary" data-action="new-note">${I('plus')} Neue Notiz</button>`)}<div class="toolbar"><label class="search-field">${I('search')}<input id="note-search" placeholder="Notizen durchsuchen ..." value="${esc(ui.noteSearch)}" aria-label="Notizen durchsuchen"></label><span class="small-legend">${data.notes.length} NOTIZEN</span></div><div id="notes-results">${notesContent()}</div>`}
  function habitStreak(h){let k=h.history[today()]?0:-1,n=0;while(h.history[dateOffset(k)]&&n<3650){n++;k--}return n}
  function habits(){const last7=Array.from({length:7},(_,i)=>dateOffset(i-6)),percentage=data.habits.length?Math.round(habitsDone()/data.habits.length*100):0;return `${pageHeader('DRANBLEIBEN','Deine Routinen','Nicht perfekt sein, sondern regelmäßig dranbleiben.',`<button class="btn btn-primary" data-action="new-habit">${I('plus')} Neue Routine</button>`)}<section class="card habits-summary"><div style="min-width:130px"><strong style="font-size:13px">Heute: ${habitsDone()}/${data.habits.length}</strong><div class="section-sub">Dein Tagesfortschritt</div></div><div class="progress-track"><div class="progress-fill" style="width:${percentage}%"></div></div><strong style="font-size:14px">${percentage}%</strong></section>${data.habits.length?`<div class="habit-grid">${data.habits.map(h=>`<article class="card habit-card"><div class="habit-top"><span class="emoji-tile" style="width:47px;height:47px;font-size:23px">${esc(h.emoji)}</span><div class="habit-main"><strong>${esc(h.name)}</strong><small>Dein Ziel für jeden Tag</small></div><button class="row-icon" data-action="delete-habit" data-id="${esc(h.id)}" title="Routine löschen" aria-label="Routine löschen">${I('trash')}</button></div><div class="habit-week">${last7.map((d,i)=>`<div class="habit-day">${weekDays[dayOfWeek(dateParse(d))]}<span class="habit-dot ${h.history[d]?'checked':''} ${d===today()?'current':''}">${h.history[d]?I('check'):dateParse(d).getDate()}</span></div>`).join('')}</div><div class="habit-actions"><span class="streak">✦ ${habitStreak(h)} Tage in Folge</span><button class="btn ${h.history[today()]?'btn-ghost':'btn-primary'} btn-small" data-action="toggle-habit" data-id="${esc(h.id)}">${I('check')} ${h.history[today()]?'Rückgängig':'Heute erledigt'}</button></div></article>`).join('')}</div>`:`<div class="card task-empty"><div class="empty-icon">${I('habits')}</div><h3>Starte deine erste Routine.</h3><p>Zum Beispiel jeden Tag 10 Minuten lesen oder eine neue Sache lernen.</p><button class="btn btn-primary" data-action="new-habit">${I('plus')} Routine erstellen</button></div>`}`}
  function focus(){let f=data.focus,r=remain(),pct=Math.round((1-r/f.durationSec)*100),sessions=data.focus.sessions.filter(s=>['focus','custom'].includes(s.mode));return `${pageHeader('ZEIT FÜR DICH','Fokus-Modus','Ein Timer, der dir hilft, konzentriert an einer Sache zu arbeiten.') }<div class="focus-layout"><section class="card focus-main"><div class="timer-presets">${[['focus','25 Min Fokus'],['short','5 Min Pause'],['long','15 Min Pause']].map(([id,label])=>`<button class="timer-preset ${f.mode===id?'active':''}" data-action="set-focus-mode" data-mode="${id}">${label}</button>`).join('')}</div><div class="timer-circle" id="focus-ring" style="--progress:${pct}%"><div class="timer-inner"><span class="eyebrow">${f.mode==='short'||f.mode==='long'?'PAUSENZEIT':'FOCUS SESSION'}</span><div class="timer-time" id="focus-clock">${formatClock(r)}</div><small>${f.running?'Läuft gerade':'Bereit, wenn du es bist'}</small></div></div><div class="timer-controls"><button class="tiny-icon-btn" data-action="focus-reset" title="Timer zurücksetzen" aria-label="Timer zurücksetzen">${I('reset')}</button><button class="btn btn-primary" data-action="focus-toggle">${I(f.running?'pause':'play')} <span id="focus-button-text">${f.running?'Pause':'Starten'}</span></button></div></section><div class="focus-side"><section class="card"><h2 class="section-title">Dein Fortschritt</h2><p class="section-sub">Abgeschlossene Fokus-Sessions</p><div class="focus-sessions"><div class="session-metric"><strong>${sessions.filter(s=>s.date===today()).length}</strong><span>Heute</span></div><div class="session-metric"><strong>${sessions.length}</strong><span>Insgesamt</span></div></div><span class="small-legend">${focusMinutesToday()} MINUTEN FOKUS HEUTE</span></section><section class="card"><h2 class="section-title">Dein Rhythmus</h2><p class="focus-instruction">1. Such dir eine Aufgabe aus.<br>2. Starte den Timer.<br>3. Konzentrier dich auf eine Sache.<br>4. Gönn dir danach eine Pause.</p><div class="field" style="margin-top:18px;margin-bottom:0"><label for="custom-minutes">Eigene Timerlänge (Minuten)</label><div class="custom-timer"><input class="field-input" id="custom-minutes" type="number" min="1" max="180" value="${Math.ceil(f.durationSec/60)}"><button class="btn btn-ghost" data-action="set-custom-timer">Übernehmen</button></div></div></section></div></div>`}
  function stats(){const last7=Array.from({length:7},(_,i)=>dateOffset(i-6));const counts=last7.map(d=>data.tasks.filter(t=>t.done&&t.completedAt&&keyDate(new Date(t.completedAt))===d).length);const max=Math.max(1,...counts),totalDone=data.tasks.filter(t=>t.done).length,minutes=data.focus.sessions.filter(s=>['focus','custom'].includes(s.mode)).reduce((n,s)=>n+s.minutes,0);return `${pageHeader('DEINE ENTWICKLUNG','Statistik','Deine Erfolge auf einen Blick. Alles basiert auf deinen echten Einträgen.')}<div class="metrics">${metric('Aufgaben erledigt',totalDone,'Insgesamt abgeschlossen','check')}${metric('Erledigungsquote',`${progress()}%`,'Von allen Aufgaben','stats')}${metric('Fokuszeit gesamt',`${minutes}m`,'Abgeschlossene Sessions','focus')}${metric('Routinen aktiv',data.habits.length,'Deine täglichen Ziele','habits')}</div><div class="charts-layout"><section class="card chart-card"><div class="card-head"><div><h2 class="section-title">Erledigte Aufgaben</h2><p class="section-sub">Letzte 7 Tage</p></div><span class="pill">${counts.reduce((a,b)=>a+b,0)} gesamt</span></div><div class="bar-chart">${last7.map((d,i)=>`<div class="bar-col"><span class="bar-count">${counts[i]}</span><div class="bar-column" title="${counts[i]} erledigte Aufgaben" style="height:${Math.max(4,Math.round(counts[i]/max*155))}px"></div><span class="bar-label">${weekDays[dayOfWeek(dateParse(d))]}</span></div>`).join('')}</div></section><section class="card chart-card"><h2 class="section-title">Deine Serien</h2><p class="section-sub">Aktuelle Routinen-Streaks</p><div class="streak-list">${data.habits.length?data.habits.map(h=>`<div class="streak-row"><span>${esc(h.emoji)} ${esc(h.name)}</span><strong>${habitStreak(h)} Tage</strong></div>`).join(''):'<p class="cal-empty">Du hast noch keine Routinen.</p>'}</div></section></div><p class="section-sub">Hinweis: Statistiken werden aus deinen gespeicherten Einträgen berechnet. Ältere Abschlüsse ohne Abschlussdatum können nicht einem bestimmten Tag zugeordnet werden.</p>`}
  function settings(){const s=data.settings;return `${pageHeader('DEIN NEXUS','Einstellungen','Passe die App an und sichere deine Daten.')}<section class="card setting-section"><div class="card-head"><h2 class="section-title">Personalisierung</h2>${I('settings')}</div><div class="setting-row"><div class="setting-copy"><strong>Dein Vorname</strong><p>Wird in der Begrüßung angezeigt.</p></div><input class="field-input" id="setting-name" maxlength="40" placeholder="Wie heißt du?" value="${esc(s.name)}"></div><div class="setting-row"><div class="setting-copy"><strong>Darstellung</strong><p>Wähle hell oder dunkel.</p></div><div class="theme-opts"><button class="option-btn ${s.theme==='dark'?'selected':''}" data-action="theme" data-value="dark">Dunkel</button><button class="option-btn ${s.theme==='light'?'selected':''}" data-action="theme" data-value="light">Hell</button></div></div><div class="setting-row"><div class="setting-copy"><strong>Akzentfarbe</strong><p>Gib deinem Space deinen Style.</p></div><div class="swatches">${[['indigo','#8f80ff'],['aqua','#39c8c9'],['pink','#e78ad9'],['orange','#ffad67']].map(([n,hex])=>`<button class="swatch ${s.accent===n?'selected':''}" style="background:${hex}" data-action="accent" data-value="${n}" title="Farbe ${n}" aria-label="Akzentfarbe ${n}"></button>`).join('')}</div></div></section><section class="card setting-section"><div class="card-head"><h2 class="section-title">Deine Daten</h2>${I('shield')}</div><div class="setting-row"><div class="setting-copy"><strong>Sicherung herunterladen</strong><p>Alle Aufgaben, Notizen, Routinen und Statistiken als JSON-Datei.</p></div><button class="btn btn-ghost" data-action="export">${I('download')} Exportieren</button></div><div class="setting-row"><div class="setting-copy"><strong>Sicherung wiederherstellen</strong><p>Eine zuvor exportierte NEXUS-Datei importieren. Bestehende Daten werden ersetzt.</p></div><button class="btn btn-ghost" data-action="import">${I('upload')} Importieren</button><input id="import-file" class="hidden-file" type="file" accept="application/json,.json"></div><div class="setting-row"><div class="setting-copy"><strong class="danger-text">Alle Daten löschen</strong><p>Setzt die App nach Bestätigung vollständig zurück.</p></div><button class="btn btn-danger" data-action="reset-all">${I('trash')} Zurücksetzen</button></div><div class="notice">${I('shield')} <strong>Privat und lokal:</strong> NEXUS benötigt kein Konto und sendet keine Einträge an einen Server. Deine Daten werden nur im aktuellen Browser auf diesem Gerät gespeichert. Nutze regelmäßig den Export, besonders bevor du Browserdaten löschst oder das Gerät wechselst. Ohne Export gibt es keine Wiederherstellung.</div></section>`}
  function pageContent(){return({dashboard,tasks,calendar,notes,habits,focus,stats,settings}[ui.page]||dashboard)()+`<p class="footer-note">NEXUS · Entwickelt, um deinen Alltag leichter zu machen · Deine Daten gehören dir.</p>`}
  function render(scroll=false){applyTheme();$('#app').innerHTML=shell();if(scroll)window.scrollTo({top:0,behavior:'instant'});tickDisplay()}
  function navigate(page){ui.page=page;render(true)}
  function modal(html){$('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Eingabefenster">${html}</div></div>`;setTimeout(()=>$('#modal-root input:not([type="hidden"]),#modal-root textarea')?.focus(),15)}
  function modalHead(title){return `<div class="modal-head"><h2>${title}</h2><button class="icon-btn" type="button" data-action="close-modal" aria-label="Schließen">${I('x')}</button></div>`}
  function taskModal(id='',date=''){let t=data.tasks.find(t=>t.id===id),v=t||{title:'',desc:'',due:date||'',priority:'medium'};modal(`${modalHead(t?'Aufgabe bearbeiten':'Neue Aufgabe')}<form id="task-form"><input type="hidden" name="id" value="${esc(id)}"><div class="field"><label for="task-title">Aufgabe *</label><input class="field-input" id="task-title" name="title" maxlength="150" value="${esc(v.title)}" placeholder="Was möchtest du erledigen?" required></div><div class="field"><label for="task-desc">Beschreibung (optional)</label><textarea class="field-input" id="task-desc" name="desc" maxlength="3000" placeholder="Weitere Informationen ...">${esc(v.desc)}</textarea></div><div class="field-grid"><div class="field"><label for="task-date">Datum (optional)</label><input class="field-input" id="task-date" type="date" name="due" value="${esc(v.due)}"></div><div class="field"><label for="task-priority">Priorität</label><select class="field-input" id="task-priority" name="priority">${Object.entries(priorities).map(([k,l])=>`<option value="${k}" ${v.priority===k?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="modal-bottom"><button class="btn btn-ghost" type="button" data-action="close-modal">Abbrechen</button><button class="btn btn-primary" type="submit">${I('check')} Speichern</button></div></form>`)}
  function noteModal(id=''){let n=data.notes.find(n=>n.id===id),v=n||{title:'',body:'',color:'violet'};modal(`${modalHead(n?'Notiz bearbeiten':'Neue Notiz')}<form id="note-form"><input type="hidden" name="id" value="${esc(id)}"><div class="field"><label for="note-title">Titel *</label><input class="field-input" id="note-title" name="title" maxlength="150" value="${esc(v.title)}" placeholder="Titel deiner Notiz" required></div><div class="field"><label for="note-body">Deine Notiz</label><textarea class="field-input" id="note-body" name="body" maxlength="50000" style="min-height:230px" placeholder="Schreib deine Gedanken auf ...">${esc(v.body)}</textarea></div><div class="field"><label>Farbe</label><div class="color-choices">${[['violet','Lila'],['aqua','Türkis'],['orange','Orange'],['pink','Pink'],['green','Grün']].map(([color,name])=>`<label class="color-radio"><input type="radio" name="color" value="${color}" ${v.color===color?'checked':''}>${name}</label>`).join('')}</div></div><div class="modal-bottom"><button class="btn btn-ghost" type="button" data-action="close-modal">Abbrechen</button><button class="btn btn-primary" type="submit">${I('check')} Speichern</button></div></form>`)}
  function habitModal(){modal(`${modalHead('Neue Routine')}<form id="habit-form"><div class="field"><label for="habit-name">Name *</label><input class="field-input" id="habit-name" name="name" maxlength="100" placeholder="z. B. Jeden Tag lesen" required></div><div class="field"><label for="habit-emoji">Symbol</label><select class="field-input" id="habit-emoji" name="emoji">${['⭐','📚','🧠','✨','🌿','🎨','🧹','🎵','💻','🏃','💧','🎯','🏒','🛌'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div class="modal-bottom"><button class="btn btn-ghost" type="button" data-action="close-modal">Abbrechen</button><button class="btn btn-primary" type="submit">${I('plus')} Hinzufügen</button></div></form>`)}
  function closeModal(){$('#modal-root').innerHTML=''}
  function focusStartPause(){let f=data.focus;if(f.running){f.remainingSec=remain();f.running=false;f.endAt=0;toast('Timer pausiert')}else{if(f.remainingSec<=0)f.remainingSec=f.durationSec;f.endAt=Date.now()+f.remainingSec*1000;f.running=true;toast('Fokus-Timer gestartet')}save();render()}
  function focusReset(){if(data.focus.running&&!confirm('Laufenden Timer zurücksetzen?'))return;data.focus.running=false;data.focus.endAt=0;data.focus.remainingSec=data.focus.durationSec;save();render();toast('Timer zurückgesetzt')}
  function setFocusMode(mode,minutes){if(data.focus.running&&!confirm('Laufenden Timer beenden und Modus wechseln?'))return;const lengths={focus:25,short:5,long:15};let length=mode==='custom'?minutes:lengths[mode];if(!length||length<1||length>180){toast('Bitte 1 bis 180 Minuten eingeben');return}data.focus={...data.focus,mode,durationSec:length*60,remainingSec:length*60,running:false,endAt:0};save();render()}
  function completedFocus(){let f=data.focus;if(!f.running)return;const counted=['focus','custom'].includes(f.mode);if(counted)f.sessions.push({date:today(),minutes:Math.round(f.durationSec/60),mode:f.mode});f.running=false;f.endAt=0;f.remainingSec=f.durationSec;save();render();toast(counted?'Fokus-Session geschafft! Stark!':'Pause vorbei!');try{let AC=window.AudioContext||window.webkitAudioContext;if(AC){let ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=660;gain.gain.setValueAtTime(.05,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.3);osc.start();osc.stop(ctx.currentTime+.3);setTimeout(()=>ctx.close(),600)}}catch(e){}}
  function tickDisplay(){if(data.focus.running&&Date.now()>=data.focus.endAt){completedFocus();return}const n=remain(),label=formatClock(n),pct=`${Math.round((1-n/data.focus.durationSec)*100)}%`;if($('#mini-timer'))$('#mini-timer').textContent=label;if($('#focus-clock'))$('#focus-clock').textContent=label;if($('#focus-ring'))$('#focus-ring').style.setProperty('--progress',pct);document.title=(data.focus.running?`${label} · `:'')+'NEXUS — Dein Space. Dein Plan.'}
  setInterval(tickDisplay,350);
  function exportData(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`NEXUS-Backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Sicherung heruntergeladen')}
  async function importData(file){if(!file)return;if(file.size>15*1024*1024){toast('Die Datei ist zu groß');return}try{let content=await file.text(),parsed=JSON.parse(content);if(!parsed||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.notes)||!Array.isArray(parsed.habits))throw Error('Keine NEXUS-Sicherung');if(!confirm('Möchtest du alle jetzigen Daten durch diese Sicherung ersetzen?'))return;data=normalize(parsed);save();render(true);toast('Sicherung importiert')}catch(e){toast('Import nicht möglich: keine gültige NEXUS-Datei')}finally{let inp=$('#import-file');if(inp)inp.value=''}}
  document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;switch(action){
    case 'navigate':navigate(b.dataset.page);break;
    case 'search':navigate('tasks');setTimeout(()=>$('#task-search')?.focus(),30);break;
    case 'dismiss-intro':data.settings.introDismissed=true;save();render();break;
    case 'filter-tasks':ui.taskFilter=b.dataset.filter;render();break;
    case 'new-task':taskModal('',b.dataset.date||'');break;
    case 'edit-task':taskModal(id);break;
    case 'toggle-task':{let t=data.tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save();render();toast(t.done?'Aufgabe erledigt!':'Aufgabe wieder geöffnet');break}
    case 'delete-task':{let t=data.tasks.find(t=>t.id===id);if(t&&confirm(`Aufgabe „${t.title}“ wirklich löschen?`)){data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('Aufgabe gelöscht')}break}
    case 'prev-month':ui.calendarMonth=new Date(ui.calendarMonth.getFullYear(),ui.calendarMonth.getMonth()-1,1);render();break;
    case 'next-month':ui.calendarMonth=new Date(ui.calendarMonth.getFullYear(),ui.calendarMonth.getMonth()+1,1);render();break;
    case 'calendar-today':ui.calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);ui.selectedDate=today();render();break;
    case 'select-date':ui.selectedDate=b.dataset.date;ui.calendarMonth=new Date(dateParse(ui.selectedDate).getFullYear(),dateParse(ui.selectedDate).getMonth(),1);render();break;
    case 'new-note':noteModal();break;
    case 'edit-note':if(ev.target.closest('button[data-action="delete-note"]'))return;noteModal(id);break;
    case 'delete-note':{ev.stopPropagation();let n=data.notes.find(n=>n.id===id);if(n&&confirm(`Notiz „${n.title}“ wirklich löschen?`)){data.notes=data.notes.filter(n=>n.id!==id);save();render();toast('Notiz gelöscht')}break}
    case 'new-habit':habitModal();break;
    case 'toggle-habit':{let h=data.habits.find(h=>h.id===id);if(!h)return;if(h.history[today()])delete h.history[today()];else h.history[today()]=true;save();render();toast(h.history[today()]?'Routine erledigt!':'Routine zurückgesetzt');break}
    case 'delete-habit':{let h=data.habits.find(h=>h.id===id);if(h&&confirm(`Routine „${h.name}“ und ihren Verlauf wirklich löschen?`)){data.habits=data.habits.filter(h=>h.id!==id);save();render();toast('Routine gelöscht')}break}
    case 'focus-toggle':focusStartPause();break;
    case 'focus-reset':focusReset();break;
    case 'set-focus-mode':setFocusMode(b.dataset.mode);break;
    case 'set-custom-timer':setFocusMode('custom',Number($('#custom-minutes')?.value));break;
    case 'theme':data.settings.theme=b.dataset.value;save();render();break;
    case 'accent':data.settings.accent=b.dataset.value;save();render();break;
    case 'export':exportData();break;
    case 'import':$('#import-file')?.click();break;
    case 'reset-all':if(confirm('Wirklich ALLE Aufgaben, Notizen, Routinen und Timerdaten löschen? Diese Aktion kann nicht rückgängig gemacht werden.')){data=starter();data.tasks=[];data.notes=[];data.habits=[];data.settings.introDismissed=true;save();navigate('dashboard');toast('Alle Daten zurückgesetzt')}break;
    case 'close-modal':closeModal();break;
    case 'backdrop':if(ev.target===b)closeModal();break;
  }});
  document.addEventListener('submit',ev=>{let form=ev.target;if(!['task-form','note-form','habit-form'].includes(form.id))return;ev.preventDefault();let fd=new FormData(form),id=String(fd.get('id')||'');
    if(form.id==='task-form'){let t=data.tasks.find(t=>t.id===id),v={title:String(fd.get('title')||'').trim(),desc:String(fd.get('desc')||'').trim(),due:String(fd.get('due')||''),priority:String(fd.get('priority')||'medium')};if(!v.title){toast('Bitte eine Aufgabe eingeben');return}if(t)Object.assign(t,v);else data.tasks.push({id:uid(),...v,done:false,completedAt:null,createdAt:new Date().toISOString()});toast(t?'Aufgabe aktualisiert':'Neue Aufgabe gespeichert')}
    else if(form.id==='note-form'){let n=data.notes.find(n=>n.id===id),v={title:String(fd.get('title')||'').trim(),body:String(fd.get('body')||''),color:String(fd.get('color')||'violet'),updatedAt:new Date().toISOString()};if(!v.title){toast('Bitte einen Titel eingeben');return}if(n)Object.assign(n,v);else data.notes.unshift({id:uid(),...v});toast(n?'Notiz aktualisiert':'Notiz gespeichert')}
    else{let name=String(fd.get('name')||'').trim();if(!name){toast('Bitte eine Routine benennen');return}data.habits.push({id:uid(),name,emoji:String(fd.get('emoji')||'⭐'),history:{}});toast('Neue Routine erstellt')}
    save();closeModal();render();
  });
  document.addEventListener('input',ev=>{if(ev.target.id==='task-search'){ui.taskSearch=ev.target.value;let el=$('#task-results');if(el)el.innerHTML=taskListContent()}else if(ev.target.id==='note-search'){ui.noteSearch=ev.target.value;let el=$('#notes-results');if(el)el.innerHTML=notesContent()}else if(ev.target.id==='setting-name'){data.settings.name=ev.target.value.slice(0,40);save();let av=$('.user-avatar');if(av)av.textContent=(data.settings.name||'DU').trim().slice(0,2).toUpperCase()}});
  document.addEventListener('change',ev=>{if(ev.target.id==='import-file')importData(ev.target.files?.[0])});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();return}let tag=ev.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||ev.ctrlKey||ev.metaKey||ev.altKey)return;if(ev.key==='n'||ev.key==='N'){ev.preventDefault();taskModal()}else if(ev.key==='/'){ev.preventDefault();navigate('tasks');$('#task-search')?.focus()}else if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.note-card')){ev.preventDefault();noteModal(ev.target.dataset.id)}});
  window.addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{data=normalize(JSON.parse(ev.newValue));render()}catch(e){}});
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
