name: Frost Skaters checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML links, page IDs and JavaScript
        run: node tools/check-frost-site.mjs
      - name: Validate Frost FAQ responses and privacy
        run: node tools/check-frost-faq.mjs
      - name: Validate Owner role tools, audit timeline and System Monitor
        run: node tools/check-frost-owner-tools.mjs
